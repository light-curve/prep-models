[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-bolt-prep"
version = "0.1.0"
description = "Chronos-Bolt ONNX prep sub-package (tiny/mini/small/base)"
requires-python = ">=3.14"
dependencies = [
    "chronos-forecasting==2.3.0",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "pyarrow>=14",
    "torch>=2.3",
    "prep-models-utils",
]

[tool.uv.sources]
prep-models-utils = { path = "../../utils", editable = true }

[tool.setuptools.packages.find]
include = ["chronos_bolt_prep*"]
