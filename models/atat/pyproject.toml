[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atat-prep"
version = "0.1.0"
description = "ATAT ONNX export sub-package"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=1.12,<3",
    "pytorch-lightning>=1.6,<2",
    "onnx>=1.14",
    "numpy<2",
    "gdown>=5.0",
    "prep-models-utils",
    "astropy>=6.1.7",
    "pandas>=1.5,<3",
]

[tool.uv.sources]
prep-models-utils = { path = "../../utils", editable = true }

[tool.setuptools.packages.find]
include = ["atat_prep*"]
