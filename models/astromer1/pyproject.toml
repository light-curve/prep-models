[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astromer1-prep"
version = "0.1.0"
description = "Astromer 1 ONNX export sub-package"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tensorflow==2.14.*; (sys_platform != 'darwin' or platform_machine != 'arm64') and (sys_platform != 'linux' or platform_machine != 'aarch64')",
    "tensorflow-macos==2.14.*; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tensorflow-cpu-aws==2.14.*; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "tf2onnx>=1.16",
    "onnx>=1.15,<1.17",
    "numpy<2",
    "toml>=0.10",
    "gdown>=5.0",
    "joblib>=1.0",
    "pandas>=1.5",
    "pyarrow>=12",
    "prep-models-utils",
]

[tool.uv.sources]
prep-models-utils = { path = "../../utils", editable = true }

[tool.setuptools.packages.find]
include = ["astromer1_prep*"]
