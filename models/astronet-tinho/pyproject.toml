[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astronet-tinho-prep"
version = "0.1.0"
description = "ONNX export utilities for AstroNet-TINHO (compressed time-series transformer for transient classification)"
requires-python = ">=3.11"
dependencies = [
    "tensorflow>=2.10,<2.16; sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64')",
    "tensorflow-cpu-aws>=2.10,<2.16; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')",
    "tf2onnx>=1.16",
    "onnx>=1.15,<1.17",
    "onnxruntime",
    "numpy<2",
    "prep-models-utils",
]

[tool.uv.sources]
prep-models-utils = { path = "../../utils", editable = true }

[tool.setuptools.packages.find]
include = ["astronet_tinho_prep*"]
