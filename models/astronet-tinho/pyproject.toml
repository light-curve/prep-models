[project]
name = "astronet-tinho-prep"
version = "0.1.0"
description = "ONNX export utilities for AstroNet-TINHO (compressed time-series transformer for transient classification)"
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.10,<2.16",
    "tf2onnx>=1.16",
    "onnx",
    "onnxruntime",
    "numpy",
    "prep-models-utils @ ../../utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astronet_tinho_prep"]

[tool.uv.sources]
prep-models-utils = { path = "../../utils" }
