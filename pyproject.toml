[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prep-models"
version = "0.1.0"
description = "CLI orchestrator for converting open-weight light-curve models to ONNX"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.1",
    "huggingface-hub>=1.26.0",
    "onnx>=1.16",
    "onnxruntime>=1.28.0",
]

[project.scripts]
prep-models = "prep_models.cli:app"

[tool.setuptools.packages.find]
include = ["prep_models*"]

[tool.ruff]
exclude = ["models/*/code"]

[tool.ruff.lint]
ignore = [
    "B008",  # Typer uses function calls in defaults (typer.Option)
]
