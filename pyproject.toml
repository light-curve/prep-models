[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "prep-models"
version = "0.1.0"
description = "CLI orchestrator for converting open-weight light-curve models to ONNX"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "huggingface-hub>=0.20",
    "onnx>=1.16",
    "onnxruntime>=1.25.1",
]

[project.scripts]
prep-models = "prep_models.cli:app"

[tool.setuptools.packages.find]
include = ["prep_models*"]
